name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      run: npm ci
      working-directory: client

    # angular.json points outputPath at ../API/wwwroot, so this has to run
    # before the API is published for the client to end up inside the output
    - name: Build angular client
      run: npm run build
      working-directory: client

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Publish API
      run: dotnet publish API/API.csproj -c Release -o publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: datingapp
        path: publish

    # Render builds the Dockerfile itself; this just tells it to start a deploy
    # once the build above has proven the code compiles. Only on main, never on PRs.
    - name: Trigger Render deploy
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
