name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      run: npm ci
      working-directory: client

    # angular.json points outputPath at ../API/wwwroot, so this has to run
    # before the API is published for the client to end up inside the output
    - name: Build angular client
      run: npm run build
      working-directory: client

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Publish API
      run: dotnet publish API/API.csproj -c Release -o publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: datingapp
        path: publish

    # Deploys the published output straight to App Service.
    # Only on main, so pull requests are validated but never deployed.
    - name: Deploy to Azure App Service
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: azure/webapps-deploy@v3
      with:
        app-name: da-2026
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish