<div class="card bg-base-200 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <h1 class="card-title justify-center text-3xl text-primary">Sign up</h1>
    <div class="card-body w-full">
        <form #registerForm="ngForm" (ngSubmit)="register()" class="flex flex-col gap-4 w-full">
            <div class="form-control mb-4">
                <label class="label" for="displayName">Display Name</label>
                <input type="text" id="displayName" name="displayName" [(ngModel)]="creds.displayName" required
                    class="input input-bordered w-full" />
            </div>
            <div class="form-control mb-4">
                <label class="label" for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="creds.email" required
                    class="input input-bordered w-full" />
            </div>
            <div class="form-control mb-4">
                <label class="label" for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="creds.password" required
                    class="input input-bordered w-full" />
            </div>            
            <div class="flex items-center justify-end gap-3">                
                <button type="button" (click)="cancel()" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </form>

    </div>
